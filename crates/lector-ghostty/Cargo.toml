[package]
name = "lector-ghostty"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lector's safe Rust adapter for Ghostty's pinned terminal C API"
repository = "https://github.com/n0ot/lector"
links = "ghostty-vt"
build = "build.rs"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
serde = { version = "1.0.203", features = ["derive", "rc"] }
vte = "0.15.0"
