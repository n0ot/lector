[package]
name = "lector-tts"
version = "0.4.2"
authors = ["Nolan Darilek <nolan@thewordnerd.info>"]
edition = "2024"
rust-version.workspace = true
description = "Lector's cross-platform text-to-speech library and speech host"
license = "MIT"
repository = "https://github.com/n0ot/lector"
readme = "README.md"
build = "build.rs"

[package.metadata.lector-upstream]
name = "tts"
version = "0.27.0"
repository = "https://github.com/ndarilek/tts-rs"
revision = "8fbcb720cb86c5166a9ed46272e3777f742da18e"

[lib]
name = "tts"
path = "src/lib.rs"

[[bin]]
name = "lector-tts"
path = "src/main.rs"

[features]
serde = []

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
dyn-clonable = "0.9"
hound = "3.5"
oxilangtag = "0.1"
parking_lot = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["process", "event"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.9.1"
tolk = { version = "0.5", optional = true }
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "event"] }
ssip-client-async = "0.19"
ssip = "=0.5.0"
zbus = { version = "6.3.0", default-features = false, features = ["default-rt", "proxy"] }

# In-process D-Bus fixtures exercise the client protocol without a daemon.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "6.3.0", default-features = false, features = ["default-rt", "proxy", "service", "p2p"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioMixerNode",
    "AVAudioMixing",
    "AVAudioNode",
    "AVAudioPlayer",
    "AVAudioPlayerNode",
    "AVAudioTime",
    "AVAudioTypes",
    "AVSpeechSynthesis",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSError",
    "NSEnumerator",
    "NSRange",
    "NSString",
] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "EventTarget",
    "SpeechSynthesis",
    "SpeechSynthesisErrorCode",
    "SpeechSynthesisErrorEvent",
    "SpeechSynthesisEvent",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "Window",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
tempfile = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
