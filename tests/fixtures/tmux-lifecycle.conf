set-option -g prefix C-a
set-option -g prefix2 None
unbind-key -T prefix C-b
bind-key -T prefix c new-window -n created "/bin/sh -c 'printf CREATED; exec /usr/bin/tail -f /dev/null'"
bind-key -T prefix % split-window -h "/bin/sh -c 'printf SPLIT; exec /usr/bin/tail -f /dev/null'"
bind-key -T prefix x confirm-before -p "kill pane? (y/n)" kill-pane
bind-key -T prefix & confirm-before -p "kill window? (y/n)" kill-window
bind-key -T prefix d detach-client
