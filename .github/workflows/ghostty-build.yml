---
name: Ghostty build matrix

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tier-one:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86-64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux ARM64 glibc
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux x86-64 glibc
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify native architecture
        run: >-
          test "$(rustc -vV | sed -n 's/^host: //p')"
          = "${{ matrix.target }}"
      - name: Build and test linked Ghostty metadata
        run: cargo ghostty-check
      - name: Check Rust formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check shell scripts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          git grep -Il -E '^#!.*(ba)?sh' -- scripts tests/fixtures/pty
          | xargs shellcheck -x
      - name: Run complete suite
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --workspace --all-targets --all-features

  tier-two-compile:
    name: ${{ matrix.target }} compile check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compile authoritative Ghostty path
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          --features ghostty-vt
