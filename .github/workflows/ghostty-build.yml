---
name: Ghostty build matrix

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions should not consume runners. Keep master runs ordered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect build inputs
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/ci_policy.py changes

  ci:
    name: CI
    if: always()
    needs: [changes, macos, linux-musl, alpine-static]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_policy.py gate

  macos:
    needs: changes
    env:
      CARGO_TARGET_DIR: target/cargo
      CARGO_INCREMENTAL: 0
      # A master-only target is validated after merge and on manual dispatch.
      # On pull requests its job reports success without building, like every
      # job does for a Markdown-only change.
      RUN_BUILD: ${{ needs.changes.outputs.build == 'true' && !(matrix.master_only && github.event_name == 'pull_request') }}
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && !(matrix.master_only && github.event_name == 'pull_request') && matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86-64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            master_only: true
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.RUN_BUILD == 'true'
      - name: Install repository Rust toolchain
        if: env.RUN_BUILD == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: env.RUN_BUILD == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Verify canonical compiler and native architecture
        if: env.RUN_BUILD == 'true'
        run: >-
          scripts/check-rust-toolchain --host "${{ matrix.target }}"
          --target "${{ matrix.target }}"
      - name: Identify Cargo cache inputs
        if: env.RUN_BUILD == 'true'
        id: cargo-cache-key
        run: python3 .github/scripts/cargo_cache_key.py --target "${{ matrix.target }}" --lane native-debug-release-all-features
      - name: Cache Cargo dependencies
        if: env.RUN_BUILD == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Build and test linked Ghostty metadata
        if: env.RUN_BUILD == 'true'
        run: cargo ghostty-check

  linux-musl:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: target/cargo
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 musl
            target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: Linux x86-64 musl
            target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.build == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt --target "${{ matrix.target }}"
      - name: Configure ordinary Cargo commands for Linux
        if: needs.changes.outputs.build == 'true'
        run: scripts/setup
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Verify canonical compiler and cross target
        if: needs.changes.outputs.build == 'true'
        run: scripts/check-rust-toolchain --host "${{ matrix.host }}" --target "${{ matrix.target }}"
      - name: Identify Cargo cache inputs
        if: needs.changes.outputs.build == 'true'
        id: cargo-cache-key
        run: python3 .github/scripts/cargo_cache_key.py --target "${{ matrix.target }}" --lane musl-debug-release-all-features
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.build == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Install pinned Zig C toolchain
        if: needs.changes.outputs.build == 'true'
        run: scripts/bootstrap_zig.sh
      - name: Build and test linked Ghostty metadata
        if: needs.changes.outputs.build == 'true'
        run: cargo ghostty-check
      - name: Compile authoritative Ghostty path
        if: needs.changes.outputs.build == 'true'
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
      - name: Link and inspect static Lector executable
        if: needs.changes.outputs.build == 'true'
        run: |
          artifact=$(
            cargo build --locked --release --target "${{ matrix.target }}" \
              --bin lector \
              --message-format=json-render-diagnostics \
            | scripts/cargo-artifact lector bin
          )
          scripts/check-static-pie "$artifact"
          "$artifact" --version
      - name: Run the same executable on Alpine
        if: needs.changes.outputs.build == 'true'
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/target/cargo/${{ matrix.target }}/release/lector:/usr/local/bin/lector:ro"
          alpine:3.24 /usr/local/bin/lector --version
      - name: Package portable Linux executable
        if: needs.changes.outputs.build == 'true'
        run: >-
          tar -czf "lector-${{ matrix.target }}.tar.gz"
          -C "target/cargo/${{ matrix.target }}/release" lector
          -C "$GITHUB_WORKSPACE" LICENSE README.md
      - name: Upload portable Linux executable
        if: needs.changes.outputs.build == 'true'
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lector-${{ matrix.target }}
          path: lector-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Check Rust formatting
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check shell scripts
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: >-
          git grep -Il -E '^#!.*(ba)?sh' -- scripts tests/fixtures/pty
          | xargs shellcheck -x
      - name: Install cargo-nextest
        if: needs.changes.outputs.build == 'true'
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: nextest
          version: 0.9.143
      - name: Run complete suite
        if: needs.changes.outputs.build == 'true'
        run: cargo nextest run --locked --workspace --all-targets --all-features
      - name: Set up tmux image builder
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached tmux image
        id: tmux-image
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        continue-on-error: true
        # docker/build-push-action v7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/docker/real-tmux.Dockerfile
          platforms: linux/amd64
          load: true
          cache-from: type=gha,timeout=2m,scope=lector-tmux-v1-linux-amd64-${{ hashFiles('tests/docker/real-tmux.Dockerfile*', 'tests/docker/install-nextest.sh', 'rust-toolchain.toml', 'scripts/check-rust-toolchain') }}
          cache-to: type=gha,mode=max,ignore-error=true,timeout=2m,scope=lector-tmux-v1-linux-amd64-${{ hashFiles('tests/docker/real-tmux.Dockerfile*', 'tests/docker/install-nextest.sh', 'rust-toolchain.toml', 'scripts/check-rust-toolchain') }}
      - name: Build tmux image without cache after cache failure
        id: tmux-image-cold
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl' && steps.tmux-image.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/docker/real-tmux.Dockerfile
          platforms: linux/amd64
          load: true
          no-cache: true
      - name: Identify container compilation cache
        id: tmux-cache-key
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TMUX_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
        run: |
          echo "prefix=$(python3 .github/scripts/tmux_cache_key.py "$TMUX_IMAGE" linux/amd64)" >> "$GITHUB_OUTPUT"
      - name: Restore container compilation cache
        id: tmux-cache
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/cargo-git
            ${{ runner.temp }}/lector-tmux-cache/cargo-registry
            ${{ runner.temp }}/lector-tmux-cache/target/debug
            ${{ runner.temp }}/lector-tmux-cache/target/x86_64-unknown-linux-musl/debug
            ${{ runner.temp }}/lector-tmux-cache/target/ghostty-prebuilt
            ${{ runner.temp }}/lector-tmux-cache/target/toolchains
          key: ${{ steps.tmux-cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.tmux-cache-key.outputs.prefix }}-
      - name: Validate restored container compilation cache
        id: tmux-cache-check
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        continue-on-error: true
        env:
          LECTOR_REAL_TMUX_PREBUILT_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
          LECTOR_REAL_TMUX_PLATFORM: linux/amd64
          LECTOR_REAL_TMUX_CACHE_DIR: ${{ runner.temp }}/lector-tmux-cache
          LECTOR_REAL_TMUX_PREPARE_ONLY: '1'
          CACHE_RESTORE_OUTCOME: ${{ steps.tmux-cache.outcome }}
        run: |
          if [[ "$CACHE_RESTORE_OUTCOME" != success ]]; then
            rm -rf -- "${RUNNER_TEMP:?}/lector-tmux-cache"
          fi
          scripts/test-real-tmux-docker
      - name: Discard unusable container compilation cache
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl' && steps.tmux-cache-check.outcome == 'failure'
        run: sudo rm -rf -- "${RUNNER_TEMP:?}/lector-tmux-cache"
      - name: Run real tmux tests in Docker
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        env:
          LECTOR_REAL_TMUX_PREBUILT_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
          LECTOR_REAL_TMUX_PLATFORM: linux/amd64
          LECTOR_REAL_TMUX_CACHE_DIR: ${{ runner.temp }}/lector-tmux-cache
        run: |
          : "${LECTOR_REAL_TMUX_PREBUILT_IMAGE:?image build did not return an ID}"
          scripts/test-real-tmux-docker
      - name: Make container artifacts readable for cache upload
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP:?}/lector-tmux-cache"
      - name: Save container compilation cache
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl' && steps.tmux-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/cargo-git
            ${{ runner.temp }}/lector-tmux-cache/cargo-registry
            ${{ runner.temp }}/lector-tmux-cache/target/debug
            ${{ runner.temp }}/lector-tmux-cache/target/x86_64-unknown-linux-musl/debug
            ${{ runner.temp }}/lector-tmux-cache/target/ghostty-prebuilt
            ${{ runner.temp }}/lector-tmux-cache/target/toolchains
          key: ${{ steps.tmux-cache-key.outputs.prefix }}-${{ github.sha }}
      - name: Run documentation tests
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked --workspace --doc --all-features


  alpine-static:
    needs: changes
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
      CARGO_INCREMENTAL: 0
    name: Alpine native static PIE
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-alpine-3.24-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Prepare Alpine's packaged compiler
        if: needs.changes.outputs.build == 'true'
        id: alpine
        run: |
          # Keep registry dependencies outside the workspace so pruning retains them.
          export CARGO_HOME="$RUNNER_TEMP/alpine-cargo"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME"
          docker run --detach --name lector-alpine --dns 1.1.1.1 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$CARGO_HOME:$CARGO_HOME" --workdir "$GITHUB_WORKSPACE" \
            --env CARGO_HOME --env CARGO_TARGET_DIR --env CARGO_INCREMENTAL \
            alpine:3.24 sleep infinity
          docker exec lector-alpine apk add --no-cache \
            bash binutils build-base ca-certificates cargo curl file git pkgconf rust tar xz
          echo "uid=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          docker exec --user "$(id -u):$(id -g)" lector-alpine \
            scripts/check-rust-toolchain --packaged --host x86_64-alpine-linux-musl
          docker exec lector-alpine rustc -vV > "$RUNNER_TEMP/alpine-rustc.txt"
      - name: Identify packaged Cargo cache inputs
        if: needs.changes.outputs.build == 'true'
        id: cargo-cache-key
        run: >-
          python3 .github/scripts/cargo_cache_key.py --target x86_64-alpine-linux-musl
          --lane alpine-packaged-release-default --compiler-metadata "$RUNNER_TEMP/alpine-rustc.txt"
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.build == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cmd-format: docker exec --user ${{ steps.alpine.outputs.uid }} lector-alpine {0}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Build and inspect with Alpine's packaged Rust
        if: needs.changes.outputs.build == 'true'
        run: |
          docker exec --user "$(id -u):$(id -g)" lector-alpine sh -lc '
            set -eu
            cargo build --locked --release --bin lector
            scripts/check-static-pie "$CARGO_TARGET_DIR/release/lector"
            "$CARGO_TARGET_DIR/release/lector" --version
          '
          # Keep this disposable container alive for rust-cache's post-job pruning.
