---
name: Ghostty build matrix

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions should not consume runners. Keep master runs ordered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect build inputs
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/ci_policy.py changes

  ci:
    name: CI
    if: always()
    needs: [changes, tier-one, tier-two-static, alpine-static]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_policy.py gate

  tier-one:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86-64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux ARM64 glibc
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Linux x86-64 glibc
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.build == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Verify canonical compiler and native architecture
        if: needs.changes.outputs.build == 'true'
        run: >-
          scripts/check-rust-toolchain --host "${{ matrix.target }}"
          --target "${{ matrix.target }}"
      - name: Build and test linked Ghostty metadata
        if: needs.changes.outputs.build == 'true'
        run: cargo ghostty-check
      - name: Check Rust formatting
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check shell scripts
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          git grep -Il -E '^#!.*(ba)?sh' -- scripts tests/fixtures/pty
          | xargs shellcheck -x
      - name: Install cargo-nextest
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: nextest
          version: 0.9.143
      - name: Run complete suite
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo nextest run --locked --workspace --all-targets --all-features
      - name: Run real tmux tests in Docker
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/test-real-tmux-docker
      - name: Run documentation tests
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --workspace --doc --all-features

  tier-two-static:
    needs: changes
    name: ${{ matrix.target }} static link
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    env:
      CC_aarch64_unknown_linux_musl: ${{ github.workspace }}/scripts/zig-cc
      CC_x86_64_unknown_linux_musl: ${{ github.workspace }}/scripts/zig-cc
      LECTOR_ZIG_CC_TARGET: ${{ matrix.zig_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
          - target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig_target: x86_64-linux-musl
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.build == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Verify canonical compiler and cross target
        if: needs.changes.outputs.build == 'true'
        run: scripts/check-rust-toolchain --host "${{ matrix.host }}" --target "${{ matrix.target }}"
      - name: Install pinned Zig C toolchain
        if: needs.changes.outputs.build == 'true'
        run: scripts/bootstrap_zig.sh
      - name: Compile authoritative Ghostty path
        if: needs.changes.outputs.build == 'true'
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          --features ghostty-vt
      - name: Link and inspect static Lector executable
        if: needs.changes.outputs.build == 'true'
        run: |
          artifact=$(
            cargo build --locked --release --target "${{ matrix.target }}" \
              --features ghostty-vt --bin lector \
              --message-format=json-render-diagnostics \
            | scripts/cargo-artifact lector bin
          )
          scripts/check-static-pie "$artifact"
          "$artifact" --version

  alpine-static:
    needs: changes
    name: Alpine native static PIE
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-alpine-3.24-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'crates/lector-ghostty/**') }}
      - name: Build and inspect with Alpine's packaged Rust
        if: needs.changes.outputs.build == 'true'
        run: |
          docker run --rm --dns 1.1.1.1 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            alpine:3.24 sh -lc '
              set -eu
              apk add --no-cache bash binutils build-base ca-certificates \
                cargo curl file git pkgconf rust tar xz
              scripts/check-rust-toolchain --packaged --host x86_64-alpine-linux-musl
              cargo build --locked --release --bin lector
              scripts/check-static-pie target/release/lector
              target/release/lector --version
            '
