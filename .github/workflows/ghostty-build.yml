---
name: Ghostty build matrix

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions should not consume runners. Each merge can publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect build inputs
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.changes.outputs.build }}
      stable_version: ${{ steps.release.outputs.stable_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: python3 -m unittest discover -s .github/scripts -v
      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/ci_policy.py changes
      - name: Check stable release versions
        id: release
        if: steps.changes.outputs.build == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.base_ref == 'master'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/publish_crates.py check

  ci:
    name: CI
    if: always()
    needs: [changes, macos, linux-native, linux-static, alpine-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_policy.py gate

  macos:
    needs: changes
    env:
      CARGO_TARGET_DIR: target/cargo
      CARGO_INCREMENTAL: 0
      # A master-only target is validated after merge and on manual dispatch.
      # On pull requests its job reports success without building, like every
      # job does for a Markdown-only change.
      RUN_BUILD: ${{ needs.changes.outputs.build == 'true' && !(matrix.master_only && github.event_name == 'pull_request') }}
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && !(matrix.master_only && github.event_name == 'pull_request') && matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86-64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            master_only: true
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.RUN_BUILD == 'true'
      - name: Install repository Rust toolchain
        if: env.RUN_BUILD == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: env.RUN_BUILD == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'build_support/ghostty.rs', 'crates/lector-ghostty/build.rs', 'crates/lector-ghostty/bootstrap/**', 'crates/lector-ghostty/abi/**') }}
      - name: Verify canonical compiler and native architecture
        if: env.RUN_BUILD == 'true'
        run: >-
          scripts/check-rust-toolchain --host "${{ matrix.target }}"
          --target "${{ matrix.target }}"
      - name: Identify Cargo cache inputs
        if: env.RUN_BUILD == 'true'
        id: cargo-cache-key
        run: python3 .github/scripts/cargo_cache_key.py --target "${{ matrix.target }}" --lane native-debug-release-all-features
      - name: Cache Cargo dependencies
        if: env.RUN_BUILD == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Build and test linked Ghostty metadata
        if: env.RUN_BUILD == 'true'
        run: cargo ghostty-check
      - name: Build and inspect release executable
        if: env.RUN_BUILD == 'true'
        id: executable
        run: |
          artifact=$(
            cargo build --locked --release --bin lector \
              --message-format=json-render-diagnostics \
            | scripts/cargo-artifact lector bin
          )
          "$artifact" --version
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/package-binary
        if: env.RUN_BUILD == 'true'
        with:
          executable: ${{ steps.executable.outputs.path }}
          target: ${{ matrix.target }}

  linux-native:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: target/cargo
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 glibc
            target: aarch64-unknown-linux-gnu
            host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: Linux x86-64 glibc
            target: x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.build == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'build_support/ghostty.rs', 'crates/lector-ghostty/build.rs', 'crates/lector-ghostty/bootstrap/**', 'crates/lector-ghostty/abi/**') }}
      - name: Verify canonical compiler and cross target
        if: needs.changes.outputs.build == 'true'
        run: scripts/check-rust-toolchain --host "${{ matrix.host }}" --target "${{ matrix.target }}"
      - name: Identify Cargo cache inputs
        if: needs.changes.outputs.build == 'true'
        id: cargo-cache-key
        run: python3 .github/scripts/cargo_cache_key.py --target "${{ matrix.target }}" --lane native-dynamic-debug-release-all-features
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.build == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Install pinned Zig C toolchain
        if: needs.changes.outputs.build == 'true'
        run: scripts/bootstrap_zig.sh
      - name: Build and test linked Ghostty metadata
        if: needs.changes.outputs.build == 'true'
        run: cargo ghostty-check
      - name: Compile authoritative Ghostty path
        if: needs.changes.outputs.build == 'true'
        run: >-
          cargo check --locked
      - name: Verify native dynamic libc linkage
        if: needs.changes.outputs.build == 'true'
        id: executable
        run: |
          artifact=$(
            cargo build --locked --release \
              --bin lector \
              --message-format=json-render-diagnostics \
            | scripts/cargo-artifact lector bin
          )
          scripts/check-dynamic-libc "$artifact"
          "$artifact" --version
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/package-binary
        if: needs.changes.outputs.build == 'true'
        with:
          executable: ${{ steps.executable.outputs.path }}
          target: ${{ matrix.target }}
      - name: Check Rust formatting
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Lint workspace
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check shell scripts
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          git grep -Il -E '^#!.*(ba)?sh' -- scripts tests/fixtures/pty
          | xargs shellcheck -x
      - name: Install cargo-nextest
        if: needs.changes.outputs.build == 'true'
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: nextest
          version: 0.9.143
      - name: Run complete suite
        if: needs.changes.outputs.build == 'true'
        run: cargo nextest run --locked --workspace --all-targets --all-features
      - name: Set up tmux image builder
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cached tmux image
        id: tmux-image
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        # docker/build-push-action v7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/docker/real-tmux.Dockerfile
          platforms: linux/amd64
          load: true
          cache-from: type=gha,timeout=2m,scope=lector-tmux-v1-linux-amd64-${{ hashFiles('tests/docker/real-tmux.Dockerfile*', 'tests/docker/install-nextest.sh', 'rust-toolchain.toml', 'scripts/check-rust-toolchain') }}
          cache-to: type=gha,mode=max,ignore-error=true,timeout=2m,scope=lector-tmux-v1-linux-amd64-${{ hashFiles('tests/docker/real-tmux.Dockerfile*', 'tests/docker/install-nextest.sh', 'rust-toolchain.toml', 'scripts/check-rust-toolchain') }}
      - name: Build tmux image without cache after cache failure
        id: tmux-image-cold
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' && steps.tmux-image.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: tests/docker/real-tmux.Dockerfile
          platforms: linux/amd64
          load: true
          no-cache: true
      - name: Identify container compilation cache
        id: tmux-cache-key
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          TMUX_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
        # Two keys: the Ghostty/Zig artifacts do not depend on Rust sources or
        # manifests, and Cargo output restores the newest compatible snapshot.
        run: python3 .github/scripts/tmux_cache_key.py "$TMUX_IMAGE" linux/amd64 >> "$GITHUB_OUTPUT"
      - name: Restore container Ghostty and Zig artifacts
        id: tmux-ghostty-cache
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/target/ghostty-prebuilt
            ${{ runner.temp }}/lector-tmux-cache/target/toolchains
          key: ${{ steps.tmux-cache-key.outputs.ghostty }}
      - name: Restore container compilation cache
        id: tmux-cache
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/cargo-git
            ${{ runner.temp }}/lector-tmux-cache/cargo-registry
            ${{ runner.temp }}/lector-tmux-cache/target/debug
          key: ${{ steps.tmux-cache-key.outputs.cargo }}-${{ github.sha }}
          restore-keys: ${{ steps.tmux-cache-key.outputs.cargo }}-
      - name: Validate restored container compilation cache
        id: tmux-cache-check
        timeout-minutes: 10
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        env:
          LECTOR_REAL_TMUX_PREBUILT_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
          LECTOR_REAL_TMUX_PLATFORM: linux/amd64
          LECTOR_REAL_TMUX_CACHE_DIR: ${{ runner.temp }}/lector-tmux-cache
          LECTOR_REAL_TMUX_PREPARE_ONLY: '1'
          CACHE_RESTORE_OUTCOME: ${{ steps.tmux-cache.outcome }}
          GHOSTTY_RESTORE_OUTCOME: ${{ steps.tmux-ghostty-cache.outcome }}
        run: |
          cache=${RUNNER_TEMP:?}/lector-tmux-cache
          # A failed restore may leave partial files; drop only that part.
          if [[ "$GHOSTTY_RESTORE_OUTCOME" != success ]]; then
            rm -rf -- "$cache/target/ghostty-prebuilt" "$cache/target/toolchains"
          fi
          if [[ "$CACHE_RESTORE_OUTCOME" != success ]]; then
            rm -rf -- "$cache/cargo-git" "$cache/cargo-registry" "$cache/target/debug"
          fi
          scripts/test-real-tmux-docker
      - name: Discard unusable container compilation cache
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' && steps.tmux-cache-check.outcome == 'failure'
        run: sudo rm -rf -- "${RUNNER_TEMP:?}/lector-tmux-cache"
      - name: Run real tmux tests in Docker
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          LECTOR_REAL_TMUX_PREBUILT_IMAGE: ${{ steps.tmux-image-cold.outputs.imageid || steps.tmux-image.outputs.imageid }}
          LECTOR_REAL_TMUX_PLATFORM: linux/amd64
          LECTOR_REAL_TMUX_CACHE_DIR: ${{ runner.temp }}/lector-tmux-cache
        run: |
          : "${LECTOR_REAL_TMUX_PREBUILT_IMAGE:?image build did not return an ID}"
          scripts/test-real-tmux-docker
      - name: Make container artifacts readable for cache upload
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' && (steps.tmux-cache.outputs.cache-hit != 'true' || steps.tmux-ghostty-cache.outputs.cache-hit != 'true')
        run: sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP:?}/lector-tmux-cache"
      - name: Save container compilation cache
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' && steps.tmux-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/cargo-git
            ${{ runner.temp }}/lector-tmux-cache/cargo-registry
            ${{ runner.temp }}/lector-tmux-cache/target/debug
          key: ${{ steps.tmux-cache-key.outputs.cargo }}-${{ github.sha }}
      - name: Save container Ghostty and Zig artifacts
        timeout-minutes: 5
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' && steps.tmux-ghostty-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ runner.temp }}/lector-tmux-cache/target/ghostty-prebuilt
            ${{ runner.temp }}/lector-tmux-cache/target/toolchains
          key: ${{ steps.tmux-cache-key.outputs.ghostty }}
      - name: Run documentation tests
        if: needs.changes.outputs.build == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --workspace --doc --all-features



  linux-static:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    env:
      CARGO_TARGET_DIR: target/cargo
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 static musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - name: Linux x86-64 static musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Install repository Rust toolchain and optional target
        if: needs.changes.outputs.build == 'true'
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt --target "${{ matrix.target }}"
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'build_support/ghostty.rs', 'crates/lector-ghostty/build.rs', 'crates/lector-ghostty/bootstrap/**', 'crates/lector-ghostty/abi/**') }}
      - name: Identify Cargo cache inputs
        if: needs.changes.outputs.build == 'true'
        id: cargo-cache-key
        run: python3 .github/scripts/cargo_cache_key.py --target "${{ matrix.target }}" --lane optional-static-musl
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.build == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Build and inspect explicitly static executable
        if: needs.changes.outputs.build == 'true'
        id: executable
        run: |
          artifact=$(
            scripts/cargo-musl build --locked --release --bin lector \
              --message-format=json-render-diagnostics \
            | scripts/cargo-artifact lector bin
          )
          scripts/check-static-pie "$artifact"
          "$artifact" --version
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/package-binary
        if: needs.changes.outputs.build == 'true'
        with:
          executable: ${{ steps.executable.outputs.path }}
          target: ${{ matrix.target }}
      - name: Check static unwinder and LuaJIT compatibility
        if: needs.changes.outputs.build == 'true'
        run: >-
          scripts/cargo-musl test --locked --test core eh_frames::

  alpine-native:
    needs: changes
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
      CARGO_INCREMENTAL: 0
    name: Alpine native dynamic libc
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.changes.outputs.build == 'true'
      - name: Cache verified Ghostty and Zig artifacts
        if: needs.changes.outputs.build == 'true'
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            target/ghostty-prebuilt
            target/toolchains
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-alpine-3.24-rustup-musl-${{ hashFiles('scripts/bootstrap_*.sh', 'scripts/lib/lock.sh', 'build_support/ghostty.rs', 'crates/lector-ghostty/build.rs', 'crates/lector-ghostty/bootstrap/**', 'crates/lector-ghostty/abi/**') }}
      - name: Prepare Alpine with the repository Rust toolchain
        if: needs.changes.outputs.build == 'true'
        id: alpine
        run: |
          # Keep registry dependencies outside the workspace so pruning retains them.
          export CARGO_HOME="$RUNNER_TEMP/alpine-cargo"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CARGO_HOME"
          docker build --file tests/docker/alpine.Dockerfile --tag lector-alpine:ci .
          docker run --detach --name lector-alpine --dns 1.1.1.1 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$CARGO_HOME:$CARGO_HOME" --workdir "$GITHUB_WORKSPACE" \
            --env CARGO_HOME --env CARGO_TARGET_DIR --env CARGO_INCREMENTAL \
            lector-alpine:ci sleep infinity
          echo "uid=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"
          docker exec --user "$(id -u):$(id -g)" lector-alpine \
            scripts/check-rust-toolchain --host x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl
          docker exec lector-alpine rustc -vV > "$RUNNER_TEMP/alpine-rustc.txt"
      - name: Identify Alpine Cargo cache inputs
        if: needs.changes.outputs.build == 'true'
        id: cargo-cache-key
        run: >-
          python3 .github/scripts/cargo_cache_key.py --target x86_64-unknown-linux-musl
          --lane alpine-rustup-release-default --compiler-metadata "$RUNNER_TEMP/alpine-rustc.txt"
      - name: Cache Cargo dependencies
        if: needs.changes.outputs.build == 'true'
        # Swatinem/rust-cache v2.9.3: prunes workspace binaries and incremental artifacts.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        continue-on-error: true
        with:
          prefix-key: lector-cargo-v1
          key: ${{ steps.cargo-cache-key.outputs.key }}
          workspaces: . -> target/cargo
          cmd-format: docker exec --user ${{ steps.alpine.outputs.uid }} lector-alpine {0}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LECTOR GHOSTTY
      - name: Build and inspect with pinned Rust on Alpine
        if: needs.changes.outputs.build == 'true'
        run: |
          docker exec --user "$(id -u):$(id -g)" lector-alpine sh -ec '
            set -eu
            cargo build --locked --release --bin lector
            scripts/check-dynamic-libc "$CARGO_TARGET_DIR/release/lector"
            "$CARGO_TARGET_DIR/release/lector" --version
          '
          # Keep this disposable container alive for rust-cache's post-job pruning.

  publish:
    name: Publish binaries
    needs: [changes, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.build == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: lector-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_release.py

  publish-crates:
    name: Publish crates.io packages
    needs: [changes, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.stable_version != '' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: >-
          rustup toolchain install "$(scripts/check-rust-toolchain --channel)"
          --profile minimal --component clippy,llvm-tools,rustfmt
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish release packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.changes.outputs.stable_version }}
        run: python3 .github/scripts/publish_crates.py publish
