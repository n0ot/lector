name: Cache retention

"on":
  workflow_run:
    workflows: [Ghostty build matrix]
    types: [completed]
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: cache-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Never check out the triggering PR or execute its code with this token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove closed PR caches and older Docker snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cache_retention.py --apply
