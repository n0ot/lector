[package]
name = "lector"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
autobins = false
autotests = false
default-run = "lector"
description = "A terminal screen reader"
license = "MIT"
repository = "https://github.com/n0ot/lector"

[workspace]
members = ["crates/lector-ghostty", "crates/lector-tts", "xtask"]
resolver = "3"

[workspace.package]
rust-version = "1.100"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
    "env",
] }
dirs = "7.0.0"
emojis = "0.9.1"
mio = { version = "1.2.5", default-features = false, features = ["os-ext", "os-poll"] }
nix = { version = "0.31.3", features = ["fs", "process", "signal", "term"] }
phf = { version = "0.14.0", default-features = false, features = ["macros"] }
portable-pty = "=0.9.0"
regex = { version = "1.13.1", default-features = false, features = [
    "std",
    "perf",
    "unicode-bool",
] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
signal-hook-mio = { version = "0.3.0", features = ["support-v1_0"] }
smallvec = "1.16.5"
similar = { version = "3.2.1", default-features = false, features = ["std", "unicode"] }
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.3", default-features = false }
unicode_names2 = "4.0.0"
mlua = { version = "0.12.2", features = ["luajit", "vendored", "error-send"] }
tts = { package = "lector-tts", version = "=0.5.0", path = "crates/lector-tts" }
terminput = "0.5.16"
thiserror = "2.0.21"
lector-ghostty = { version = "=0.5.0", path = "crates/lector-ghostty" }

[[bin]]
name = "lector"
path = "src/main.rs"

[[bin]]
name = "lector-harness"
path = "src/bin/lector-harness/main.rs"
required-features = ["test-tools"]
test = false
bench = false

[features]
test-tools = []

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
# Enable the fixture binary for tests from the checkout without including it
# in normal builds or installs. Cargo strips path-only dev dependencies when packaging.
lector = { path = ".", features = ["test-tools"] }
tempfile = "3.27.0"

[build-dependencies]
cc = "1.11.2"

[profile.test]
debug = "line-tables-only"

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "core"
path = "tests/suite_core.rs"

[[test]]
name = "ghostty_build"
path = "tests/ghostty_build.rs"

[[test]]
name = "terminal"
path = "tests/suite_terminal.rs"

[[test]]
name = "presentation"
path = "tests/suite_presentation.rs"

[[test]]
name = "speech"
path = "tests/suite_speech.rs"

[[test]]
name = "tmux"
path = "tests/suite_tmux.rs"

[[test]]
name = "live_pty"
path = "tests/live_pty.rs"

[[test]]
name = "tmux_adversary_live"
path = "tests/tmux_adversary_live.rs"
