[package]
name = "lector"
version = "0.4.1"
edition = "2024"
autobins = false
autotests = false
default-run = "lector"
description = "A terminal screen reader"
license = "MIT"
repository = "https://github.com/n0ot/lector"

[workspace]
members = ["crates/lector-ghostty", "crates/lector-tts-backend", "xtask"]
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4.38"
clap = { version = "4.5.11", features = ["derive", "env"] }
dirs = "6.0.0"
emojis = "0.8.0"
mio = { version = "1.1.1", features = ["os-ext", "os-poll"] }
nix = { version = "0.28.0", features = ["fs", "process", "signal", "term"] }
phf = { version = "0.13.1", features = ["macros"] }
portable-pty = "=0.9.0"
regex = { version = "1.10.5", default-features = false, features = [
    "std",
    "perf",
    "unicode-bool",
] }
serde = { version = "1.0.203", features = ["derive", "rc"] }
serde_json = "1.0.120"
signal-hook = "0.3.17"
signal-hook-mio = { version = "0.2.3", features = ["support-v1_0"] }
similar = { version = "2.5.0", features = ["unicode"] }
unicode-segmentation = "1.11.0"
unicode-width = "0.2.2"
mlua = { version = "0.11", features = ["luajit", "vendored"] }
tts = { package = "lector-tts-backend", version = "0.1.0", path = "crates/lector-tts-backend" }
terminput = "0.5.12"
thiserror = "2.0.17"
lector-ghostty = { version = "0.1.0", path = "crates/lector-ghostty" }

[features]
default = ["ghostty-vt"]
ghostty-vt = []

[[bin]]
name = "lector"
path = "src/main.rs"

[[bin]]
name = "lector-harness"
path = "src/bin/lector-harness.rs"
test = false

[[bin]]
name = "proc_stub_server"
path = "src/bin/proc_stub_server.rs"
test = false

[[bin]]
name = "tmux-control-adversary"
path = "src/bin/tmux-control-adversary.rs"
test = false

[[bin]]
name = "lector-ghostty-bench"
path = "src/bin/lector-ghostty-bench.rs"
required-features = ["ghostty-vt"]
test = false
bench = false

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3.25.0"

[profile.test]
debug = "line-tables-only"

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "core"
path = "tests/suite_core.rs"

[[test]]
name = "ghostty_build"
path = "tests/ghostty_build.rs"

[[test]]
name = "terminal"
path = "tests/suite_terminal.rs"

[[test]]
name = "presentation"
path = "tests/suite_presentation.rs"

[[test]]
name = "speech"
path = "tests/suite_speech.rs"

[[test]]
name = "tmux"
path = "tests/suite_tmux.rs"

[[test]]
name = "live_pty"
path = "tests/live_pty.rs"

[[test]]
name = "tmux_adversary_live"
path = "tests/tmux_adversary_live.rs"
