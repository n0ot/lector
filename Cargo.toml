[package]
name = "lector"
version = "0.3.1"
edition = "2024"
autobins = false
default-run = "lector"
publish = false
description = "A terminal screen reader"
license = "MIT"
repository = "https://github.com/n0ot/lector"

[workspace]
members = ["crates/lector-ghostty", "xtask"]
resolver = "3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
chrono = "0.4.38"
clap = { version = "4.5.11", features = ["derive", "env"] }
dirs = "6.0.0"
emojis = "0.8.0"
mio = { version = "1.1.1", features = ["os-ext", "os-poll"] }
nix = { version = "0.28.0", features = ["fs", "process", "signal", "term"] }
phf = { version = "0.13.1", features = ["macros"] }
portable-pty = "=0.9.0"
regex = { version = "1.10.5", default-features = false, features = [
    "std",
    "perf",
    "unicode-bool",
] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
signal-hook = "0.3.17"
signal-hook-mio = { version = "0.2.3", features = ["support-v1_0"] }
similar = { version = "2.5.0", features = ["unicode"] }
unicode-segmentation = "1.11.0"
unicode-width = "0.2.2"
mlua = { version = "0.11", features = ["luajit", "vendored"] }
tts = { git = "https://github.com/ndarilek/tts-rs", rev = "8fbcb720cb86c5166a9ed46272e3777f742da18e" }
terminput = "0.5.12"
thiserror = "2.0.17"
lector-ghostty = { path = "crates/lector-ghostty" }

[features]
default = ["ghostty-vt"]
ghostty-vt = []

[[bin]]
name = "lector"
path = "src/main.rs"

[[bin]]
name = "lector-harness"
path = "src/bin/lector-harness.rs"

[[bin]]
name = "lector-tts"
path = "src/bin/lector-tts.rs"

[[bin]]
name = "proc_stub_server"
path = "src/bin/proc_stub_server.rs"

[[bin]]
name = "tmux-control-adversary"
path = "src/bin/tmux-control-adversary.rs"

[[bin]]
name = "lector-ghostty-bench"
path = "src/bin/lector-ghostty-bench.rs"
required-features = ["ghostty-vt"]
test = false
bench = false

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
